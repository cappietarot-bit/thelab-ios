<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#060d0f">
</head>
<body>
<title>The Lab — Protocol Tracker</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="nocturne.css">

<div class="app">
  <div class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="14" y="3" width="12" height="7" rx="2" fill="var(--accent)"/>
        <path d="M15 10h10v20a5 5 0 0 1-5 5 5 5 0 0 1-5-5V10Z" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
        <path d="M15 24h10" stroke="var(--accent)" stroke-width="2.4"/>
        <rect x="17.5" y="27" width="5" height="6" rx="1.6" fill="var(--accent)" opacity=".55"/>
      </svg>
      <div><h1>The Lab</h1><div class="sub" id="topSub">Today</div></div>
      <div class="spacer"></div>
      <button class="iconbtn bloodbtn" id="bloodBtn" aria-label="Bloodwork" data-tip="Bloodwork"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.4 4.3 6.5 8 6.5 11.4A6.5 6.5 0 0 1 12 20.5a6.5 6.5 0 0 1-6.5-6.6C5.5 10.5 8.6 6.8 12 2.5Z"/></svg></button><button class="iconbtn cycbtn" id="cycBtn" aria-label="Cycle" data-tip="Cycle" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6" stroke-linecap="round"/></svg></button><button class="iconbtn avatar" id="profileBtn" title="Settings" aria-label="Settings">R</button>
    </div>
  </div>

  <main>
    <section class="view on" id="v-track"></section>
    <section class="view" id="v-guide"></section>
    <section class="view" id="v-labs"></section>
    <section class="view" id="v-coach"></section>
    <section class="view" id="v-gym"></section>
    <section class="view" id="v-food"></section>
    <section class="view" id="v-cal"></section>
    <section class="view" id="v-cycle"></section>
    <section class="view" id="v-settings"></section>
  </main>

  <button class="fab" id="fab" aria-label="Add peptide">+</button>
  <div class="install" id="installBar"></div>
  <div class="bgimg" id="bgimg"></div>
  <div class="bguard" id="bguard"></div>
  <div class="deepview" id="gearView"><div id="gearBody"></div></div>
  <div class="dayoverlay" id="dayOverlay"></div>
  <div class="player" id="player"></div>
  <div class="deepview" id="deepView">
    <button class="deepx" id="deepClose" aria-label="Close">✕</button>
    <div id="deepBody"></div>
  </div>
  <div class="alertborder" id="alertBorder"></div>

  <nav class="nav" id="nav">
    <button data-tab="track" class="on"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke-linecap="round"/></svg></span>Today</button>
    <button data-tab="guide"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5Z"/><path d="M8 3v18M12 8h4M12 12h4" stroke-linecap="round"/></svg></span>Stack</button>
    <button data-tab="coach"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12c0 3.6-3.6 6.5-8 6.5a10 10 0 01-2.6-.34L5 20l1.2-3.2A6.8 6.8 0 014 12c0-3.6 3.6-6.5 8-6.5s8 2.9 8 6.5Z" stroke-linejoin="round"/><path d="M9 11.5h6M9 14h3.5" stroke-linecap="round"/></svg></span>Coach</button>
    <button data-tab="gym"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 8v8M3.5 10v4M17.5 8v8M20.5 10v4M6.5 12h11" stroke-linecap="round"/></svg></span>Gym</button>
    <button data-tab="food"><span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v8a2 2 0 002 2 2 2 0 002-2V3M8 3v8M14 3c-1 3-1 6 1 7v11M18.5 3v18" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v8" stroke-linecap="round"/></svg></span>Food</button>
  </nav>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script src="core.js"></script>
<script src="nocturne.js"></script>
</body>
</html>
